[package]
name = "svg2grbl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
cavalier_contours = "0.7"
clap = { version = "4.6.0", features = ["derive"] }
csscolorparser = "0.8"
env_logger = "0.11.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4.29"
roxmltree = "0.21.1"
svg2polylines = { path = "../svg2polylines" }
svgtypes = "0.16.1"

# cavalier_contours (and its transitive dep static_aabb2d_index) sprinkle
# debug_assert!s through their offset / spatial-index code that catch
# internal invariants the functions still return valid results for. We hit
# several on real SVG glyph offsets (repeat-position, end-point-on-final-
# offset-vertex, and now min<=max on an internal aabb index entry). In
# release these are no-ops and the output is correct; disable them in dev
# too so the program doesn't panic on inputs that work fine in release.
[profile.dev.package.cavalier_contours]
debug-assertions = false

[profile.dev.package.static_aabb2d_index]
debug-assertions = false
